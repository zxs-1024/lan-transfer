<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>邻传 · 文件下载</title>
  <link rel="icon" href="/apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/share.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/s/__SHARE_TOKEN__/" aria-label="邻传文件下载首页">
        <img src="/apple-touch-icon.png" alt="" width="36" height="36">
        <span>邻传</span>
      </a>
      <span class="secure-label">
        <i data-lucide="shield-check"></i>
        <span>局域网直连</span>
      </span>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro">
      <p class="eyebrow">来自 __HOSTNAME__</p>
      <h1>文件已准备好</h1>
      <p class="intro-copy">点击文件即可下载，也可以一次获取全部文件。</p>
    </section>

    <section class="file-panel" aria-labelledby="listTitle">
      <div class="panel-heading">
        <div>
          <h2 id="listTitle">共享文件</h2>
          <p id="summary">正在读取文件列表</p>
        </div>
        <button class="download-all" id="downloadAllButton" type="button" disabled>
          <i data-lucide="download"></i>
          <span>全部下载</span>
        </button>
      </div>

      <div class="loading-list" id="loadingList" aria-label="正在加载文件">
        <div class="loading-row"></div>
        <div class="loading-row"></div>
        <div class="loading-row"></div>
      </div>
      <div class="file-list" id="fileList" role="list"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon"><i data-lucide="package-open"></i></div>
        <h2>暂无共享文件</h2>
        <p>请在电脑上的邻传扩展中添加文件，然后刷新此页面。</p>
        <button class="refresh-button" id="emptyRefreshButton" type="button">
          <i data-lucide="refresh-cw"></i>
          <span>刷新列表</span>
        </button>
      </div>
      <div class="error-state" id="errorState" hidden>
        <div class="empty-icon error"><i data-lucide="wifi-off"></i></div>
        <h2>无法读取文件</h2>
        <p>请确认电脑上的邻传助手仍在运行，且手机与电脑连接同一 Wi-Fi。</p>
        <button class="refresh-button" id="errorRefreshButton" type="button">
          <i data-lucide="refresh-cw"></i>
          <span>重新连接</span>
        </button>
      </div>
    </section>

    <p class="footer-note">
      <i data-lucide="lock-keyhole"></i>
      <span>仅同一网络中的访问者可查看此链接中的文件。</span>
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/s/__SHARE_TOKEN__/share.js"></script>
</body>
</html>
